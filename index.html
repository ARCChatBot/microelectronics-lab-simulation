*{box-sizing:border-box}html,body{margin:0;height:100%}#app{position:fixed;inset:0}#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
/* Operation Semi / MI-CHIPS presentation color system.
   Deep slate + white surfaces, Trojan Blue text, orange as a small accent, Inter throughout. */
:root{
  --c01:#0B0F19; /* Deep Academic Slate: primary text on white */
  --c02:#FFFFFF; /* Presentation White */
  --c03:#00358E; /* Trojan Blue: headings, links, primary action */
  --c04:#FF6700; /* Precision Orange: small marks, indexes, highlights */
  --c05:#111928; /* Night Slate: dark secondary surfaces */
  --c06:#A6AFC1; /* Body Silver: body copy on dark */
  --c07:#53617A; /* Label Slate: labels and secondary text on white */
  --c08:#FAFBFD; /* Soft White: alternate light surfaces */
  --c09:#E0E5EC; /* Divider Gray: borders and separators */
  --c10:#73C5FB; /* Technology Ice Blue: indicators on dark */
  --c11:#A4B4D0; /* Advisor Blue Gray: eyebrow text on dark */
  --c12:#E3EDFC; /* Caption Frost: bright secondary on dark */
}
[hidden]{display:none!important}
html,body{background:var(--c08);overflow:hidden}
#app{position:absolute!important;inset:auto!important;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;font-family:Inter,system-ui,sans-serif;color:var(--c01);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
#gl{touch-action:none;cursor:grab}
#gl.drag{cursor:grabbing}
.ui{position:absolute;inset:0;pointer-events:none}
.mo{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.cp{position:absolute;z-index:2;background:var(--c02);border:1px solid var(--c09);border-radius:6px;box-shadow:0 2px 10px rgba(11,15,25,.06)}
.ph{display:flex;align-items:center;gap:8px;font:700 10.5px Inter,sans-serif;letter-spacing:1.8px;color:var(--c03);margin-bottom:8px}
.ph i{display:block;width:3px;height:13px;background:var(--c04)}
.bt{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:8px;height:26px;padding:0 10px;margin-bottom:4px;border:1px solid var(--c09);border-radius:4px;background:var(--c02);font:600 11px Inter,sans-serif;letter-spacing:.7px;color:var(--c01);white-space:nowrap;user-select:none}
.bt:hover{background:var(--c12)}
.bt.on{background:var(--c01);border-color:var(--c01);color:var(--c02)}
.bt em{font-style:normal;color:var(--c07);width:14px;font-weight:700}
.bt.on em{color:var(--c10)}
.bt u{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--c04);visibility:hidden;text-decoration:none}
.bt.here u{visibility:visible}
.bt:focus-visible{outline:2px solid var(--c03);outline-offset:2px}
.tg{position:absolute;z-index:2;top:16px;right:16px;display:flex;gap:5px}
.tg .bt{margin:0}
.desc{font-size:12px;line-height:1.45;color:var(--c07);margin-top:8px;min-height:104px}
.now{font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1.15;color:var(--c01)}
.where{font:600 10.5px Inter,sans-serif;letter-spacing:1.2px;color:var(--c03);text-transform:uppercase;margin:4px 0 9px}
.row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-top:1px solid var(--c09);font-size:12px}
.row span{color:var(--c07)}
.row b{font-weight:600;text-align:right;color:var(--c01)}
.air{width:100%;border-collapse:collapse;font:500 11px Inter,sans-serif}
.air th{font-weight:600;color:var(--c07);text-align:right;padding:2px 0 2px 8px;letter-spacing:.3px;font-size:9.5px}
.air td{text-align:right;padding:3px 0;border-top:1px solid var(--c09)}
.air th:first-child,.air td:first-child{text-align:left;font-size:11.5px}
.seg{position:absolute;top:0;height:22px;border-radius:3px;background:var(--c09);overflow:hidden}
.seg.move{background:repeating-linear-gradient(90deg,var(--c06) 0 3px,transparent 3px 6px);top:9px;height:4px;border-radius:0}
.seg i{position:absolute;left:0;top:0;bottom:0;background:var(--c03)}
.segl{position:absolute;top:27px;font:600 9px Inter,sans-serif;letter-spacing:.7px;color:var(--c07);text-align:center;white-space:nowrap}
.hit{position:absolute;pointer-events:auto;cursor:ew-resize}
.lab{position:absolute;z-index:1;transform:translate(-50%,-100%);padding:3px 7px;border-radius:3px;background:var(--c01);color:var(--c02);font:600 10px Inter,sans-serif;letter-spacing:.8px;white-space:nowrap}
.lab.zone{background:none;color:var(--c07);font-size:10.5px;letter-spacing:1.6px;transform:translate(-50%,-50%)}
.lab.w{background:var(--c04)}
.tourchip{display:none!important}
.nums{position:absolute;left:240px;top:60px;width:1030px;height:740px;overflow:auto;pointer-events:auto;padding:18px 22px;display:none}
.nums.on{display:block}
.nums table{width:100%;border-collapse:collapse;font-size:12px}
.nums td{padding:5px 8px 5px 0;border-top:1px solid var(--c09);vertical-align:top}
.nums td:first-child{font-weight:600;white-space:nowrap}
.kind{display:inline-block;padding:1px 6px;border-radius:3px;font:700 9px Inter,sans-serif;letter-spacing:.8px;text-transform:uppercase;background:var(--c09);color:var(--c07)}
.kind.guess{background:var(--c04);color:var(--c02)}
.kind.typical{background:var(--c12);color:var(--c03)}
.kind.datasheet{background:var(--c03);color:var(--c02)}
body>.turn{position:fixed;left:0;right:0;bottom:18px;text-align:center;font:600 12px/1.4 Inter,sans-serif;letter-spacing:1px;color:var(--c07);text-transform:uppercase;display:none}
@media (orientation:portrait) and (max-width:820px){body>.turn{display:block}}

/* the station card */
.card{position:absolute;left:244px;width:1020px;bottom:102px;z-index:3;padding:14px 18px;background:var(--c02);border:1px solid var(--c09);border-left:4px solid var(--c04);border-radius:6px;box-shadow:0 6px 24px rgba(11,15,25,.14);pointer-events:auto}
.card[hidden]{display:none}
.ck{font:700 10px Inter,sans-serif;letter-spacing:1.8px;color:var(--c03)}
.ct{display:flex;align-items:baseline;gap:12px;margin:4px 0 10px;padding-right:250px}
.ct b{font-size:24px;font-weight:800;letter-spacing:-.6px;color:var(--c01)}
.ct span{font:600 10.5px Inter,sans-serif;letter-spacing:1.2px;color:var(--c07);text-transform:uppercase}
.cc{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:22px}
.cc h4{margin:0 0 4px;font:700 9.5px Inter,sans-serif;letter-spacing:1.6px;color:var(--c07)}
.cc p{margin:0;font-size:13px;line-height:1.5;color:var(--c01)}
.cb{position:absolute;right:16px;top:14px;display:flex;gap:6px}
.cb .bt{margin:0;height:32px;padding:0 14px}
.cb .bt[hidden]{display:none}
.cb .cgo{background:var(--c03);border-color:var(--c03);color:var(--c02)}
.cb .cgo:hover{background:#002a72}
.card .turn{display:flex;align-items:center;gap:10px;margin-top:12px;padding:9px 12px;border-radius:4px;background:var(--c01);color:var(--c02);font:500 13px Inter,sans-serif}
.card .turn[hidden]{display:none}
.card .turn b{font:800 10px Inter,sans-serif;letter-spacing:1.8px;color:var(--c04)}
.card .turn i{width:8px;height:8px;border-radius:50%;background:var(--c04);animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}

/* the control on the machine */
.hot{position:absolute;z-index:2;width:0;height:0;padding:0;border:0;background:none;pointer-events:auto;cursor:pointer}
.hot[hidden]{display:none}
.hot i{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;background:rgba(255,103,0,.25);border:2.5px solid var(--c04);animation:ping 1.4s ease-out infinite}
.hot i::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--c04)}
.hot span{position:absolute;left:26px;top:-14px;padding:6px 10px;border-radius:4px;background:var(--c01);color:var(--c02);font:700 12px Inter,sans-serif;white-space:nowrap;box-shadow:0 3px 10px rgba(11,15,25,.25)}
.hot span::before{content:"▶ ";color:var(--c04)}
.hot.flip span{left:auto;right:26px}
.hot:hover span,.hot:focus-visible span{background:var(--c03)}
.hot:focus-visible{outline:none}
.hot:focus-visible i{outline:3px solid var(--c03);outline-offset:3px}
.hot.edge i{animation-duration:.9s}
.hot.nudge span{animation:shake .45s}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,103,0,.55)}100%{box-shadow:0 0 0 18px rgba(255,103,0,0)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.hot i,.card .turn i{animation:none}.hot.nudge span{animation:none}}

/* feedback after each action */
.card.in{animation:cardIn .45s cubic-bezier(.16,1,.3,1)}
.card.out{animation:cardOut .38s cubic-bezier(.6,0,.9,.35) forwards}
@keyframes cardIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(30px)}}
.toast{position:absolute;z-index:4;left:754px;top:62px;transform:translate(-50%,-14px);opacity:0;display:flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border-radius:5px;background:var(--c01);color:var(--c02);font:600 13px Inter,sans-serif;box-shadow:0 6px 18px rgba(11,15,25,.25);transition:opacity .3s,transform .45s cubic-bezier(.16,1,.3,1);pointer-events:none;white-space:nowrap}
.toast[hidden]{display:none}
.toast.in{opacity:1;transform:translate(-50%,0)}
.toast i{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--c04);font-style:normal;font-size:11px;color:var(--c02)}
.toast.done i{background:var(--c03);color:var(--c10)}
.burst{position:absolute;z-index:4;width:0;height:0;pointer-events:none}
.burst i{position:absolute;left:-20px;top:-20px;width:40px;height:40px;border-radius:50%;border:3px solid var(--c04);animation:burst .7s cubic-bezier(.16,1,.3,1) forwards}
.burst i+i{border-color:var(--c03);animation-delay:.1s;opacity:0}
.burst b{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;background:var(--c03);color:var(--c02);display:flex;align-items:center;justify-content:center;font-size:15px;animation:pop .8s cubic-bezier(.16,1,.3,1) forwards}
@keyframes burst{0%{transform:scale(.4);opacity:1}100%{transform:scale(2.6);opacity:0}}
@keyframes pop{0%{transform:scale(0)}35%{transform:scale(1.15)}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.seq{left:584px;top:250px;width:340px;padding:16px 18px 14px;z-index:4}
.seq[hidden]{display:none}
.si{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--c09);font-size:13px;color:var(--c07);transition:color .2s}
.si b{width:18px;height:18px;border-radius:50%;border:2px solid var(--c09);display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--c02);transition:all .25s}
.si.ok{color:var(--c01)}
.si.ok b{background:var(--c03);border-color:var(--c03);transform:scale(1.1)}
.si.ok b::after{content:"✓"}
.sbar{height:4px;margin-top:10px;background:var(--c09);border-radius:2px;overflow:hidden}
.sbar i{display:block;height:100%;width:0;background:var(--c04);transition:width .35s}
@media (prefers-reduced-motion:reduce){.card.in,.card.out,.burst i,.burst b{animation:none}.toast{transition:none}}

/* the close-up of the wafer while a step runs */
.closeup{left:244px;width:1020px;bottom:102px;padding:10px 16px 12px;z-index:3;opacity:0;transform:translateY(20px);transition:opacity .35s,transform .45s cubic-bezier(.16,1,.3,1);pointer-events:none;border-left:4px solid var(--c03)}
.closeup.on{opacity:1;transform:none}
.closeup canvas{display:block;border-radius:4px}
.cuh{display:flex;align-items:baseline;gap:16px;margin-bottom:8px}
.cuh .ph{margin:0;white-space:nowrap}
.cucap{font-size:13px;line-height:1.35;color:var(--c01);font-weight:500}
@media (prefers-reduced-motion:reduce){.closeup{transition:none}}

/* student sign-in */
.signin{position:absolute;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(11,15,25,.55);pointer-events:auto}
.signin[hidden]{display:none}
.sbox{width:520px;padding:26px 30px 22px;background:var(--c02);border-radius:8px;border-left:4px solid var(--c04);box-shadow:0 20px 60px rgba(11,15,25,.35)}
.sbox h2{margin:6px 0 8px;font-size:26px;font-weight:800;letter-spacing:-.6px;color:var(--c01)}
.sbox p{margin:0 0 16px;font-size:13px;line-height:1.5;color:var(--c07)}
.sbox label{display:block;margin:10px 0 5px;font:700 10px Inter,sans-serif;letter-spacing:1.4px;color:var(--c07);text-transform:uppercase}
.sbox input{width:100%;height:38px;padding:0 12px;border:1px solid var(--c09);border-radius:4px;font:500 14px Inter,sans-serif;color:var(--c01);background:var(--c08)}
.sbox input:focus{outline:2px solid var(--c03);outline-offset:0;background:var(--c02)}
.srow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.serr{margin-top:10px;font-size:12.5px;color:#c8281e;font-weight:600}
.serr[hidden]{display:none}
.sgo{margin:18px 0 0;height:42px;justify-content:center;width:100%;background:var(--c03);border-color:var(--c03);color:var(--c02);font-size:12px;font-family:Inter,sans-serif}
.sgo:hover{background:#002a72}
.snote{margin-top:10px;font-size:11.5px;line-height:1.4;color:var(--c07)}
.stu{position:absolute;z-index:2;left:410px;top:14px;display:flex;align-items:center;gap:10px;height:30px;padding:0 6px 0 12px;border:1px solid var(--c09);border-radius:4px;background:var(--c02);pointer-events:auto}
.stu[hidden]{display:none}
.stu b{font-size:12.5px;font-weight:700;color:var(--c01)}
.stu span{font-size:11px;color:var(--c07)}
.stu .bt{margin:0;height:22px;font-size:9.5px}

/* the station quiz */
.quiz{position:absolute;left:244px;width:1020px;bottom:102px;z-index:4;padding:16px 20px;background:var(--c02);border:1px solid var(--c09);border-left:4px solid var(--c03);border-radius:6px;box-shadow:0 6px 24px rgba(11,15,25,.16);pointer-events:auto}
.quiz[hidden]{display:none}
.quiz.in{animation:cardIn .45s cubic-bezier(.16,1,.3,1)}
.qk{font:700 10px Inter,sans-serif;letter-spacing:1.8px;color:var(--c03)}
.qq{margin:6px 0 12px;font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.3;color:var(--c01)}
.qo{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qopt{display:flex;align-items:center;gap:10px;min-height:42px;padding:8px 12px;border:1.5px solid var(--c09);border-radius:5px;background:var(--c02);font:500 13.5px Inter,sans-serif;color:var(--c01);text-align:left;cursor:pointer}
.qopt em{flex:none;display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:var(--c12);font:800 11px Inter,sans-serif;font-style:normal;color:var(--c03)}
.qopt:hover:not(:disabled){border-color:var(--c03);background:var(--c08)}
.qopt:focus-visible{outline:2px solid var(--c03);outline-offset:2px}
.qopt:disabled{cursor:default}
.qopt.right{border-color:#2c8a4f;background:#eaf6ef}
.qopt.right em{background:#2c8a4f;color:#fff}
.qopt.wrong{border-color:#c8281e;background:#fbeceb}
.qopt.wrong em{background:#c8281e;color:#fff}
.qf{margin-top:12px;padding:9px 12px;border-radius:4px;font-size:13px;line-height:1.45;color:var(--c01)}
.qf[hidden]{display:none}
.qf.ok{background:#eaf6ef}
.qf.ok b{color:#1f6e3e}
.qf.no{background:#fbeceb}
.qf.no b{color:#a3201a}
.qb{display:flex;justify-content:flex-end;margin-top:10px}
.qb .bt{margin:0;height:34px;padding:0 16px;background:var(--c03);border-color:var(--c03);color:var(--c02)}
.qb .bt[hidden]{display:none}

/* results and class results */
.results{left:244px;top:60px;width:1020px;max-height:740px;overflow:auto;padding:20px 24px;z-index:5;pointer-events:auto;border-left:4px solid var(--c04)}
.results[hidden]{display:none}
.results.in{animation:cardIn .5s cubic-bezier(.16,1,.3,1)}
.rtop{display:grid;grid-template-columns:1.5fr .6fr .85fr .95fr 1.25fr;gap:10px;margin:8px 0 16px}
.rtop>div{padding:12px 14px;border:1px solid var(--c09);border-radius:6px}
.rtop em{display:block;font:700 9.5px Inter,sans-serif;font-style:normal;letter-spacing:1.6px;color:var(--c07)}
.rwho b{display:block;font-size:20px;font-weight:800;letter-spacing:-.4px}
.rwho span{display:block;font-size:12px;color:var(--c07);margin-top:3px}
.rgrade b{display:block;font-size:44px;font-weight:800;line-height:1;margin-top:4px;color:var(--c03)}
.rscore b{display:block;font-size:24px;font-weight:800;margin-top:6px}
.rscore span{font-size:13px;color:var(--c07)}
.rstat b{display:block;font-size:20px;font-weight:800;margin-top:6px}
.rstat span{display:block;font-size:12px;color:var(--c07);margin-top:3px}
.rstat.ok{background:#eaf6ef;border-color:#bfe3cc}
.rstat.ok b{color:#1f6e3e}
.rstat.no{background:#fbeceb;border-color:#f0c7c4}
.rstat.no b{color:#a3201a}
.rstat.mid b{color:var(--c04)}
.rbody{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}
.rtab,.ctab{width:100%;border-collapse:collapse;font-size:12.5px}
.rtab th,.ctab th{text-align:left;font:700 9.5px Inter,sans-serif;letter-spacing:1.4px;color:var(--c07);padding:4px 0}
.rtab td,.ctab td{padding:6px 8px 6px 0;border-top:1px solid var(--c09)}
.m{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;margin-right:4px;border-radius:50%;font-style:normal;font-weight:800;font-size:11px}
.m.ok{background:#eaf6ef;color:#1f6e3e}
.m.no{background:#fbeceb;color:#a3201a}
.m.skip{background:var(--c09);color:var(--c07)}
.rnote{padding:10px 12px;border-radius:4px;background:var(--c12);font-size:12.5px;line-height:1.45;color:var(--c03)}
.rbtns{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.rbtns .bt{margin:0;height:34px;padding:0 14px}
.rbtns .bt.pri{background:var(--c03);border-color:var(--c03);color:var(--c02)}
.rscale{font-size:11.5px;line-height:1.45;color:var(--c07)}
.cbar{display:flex;align-items:center;gap:8px;margin:6px 0 12px;font-size:13px;color:var(--c07)}
.cbar span{margin-right:auto}
.cbar .bt{margin:0;height:30px}
.cbar .bt[hidden]{display:none}
.cmsg{margin-bottom:10px;font-size:12.5px;color:var(--c07)}
.cempty{padding:20px 0;font-size:13px;color:var(--c07)}
.pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.pill.ok{background:#eaf6ef;color:#1f6e3e}
.pill.no{background:#fbeceb;color:#a3201a}
.pill.mid{background:var(--c12);color:var(--c03)}
@media (prefers-reduced-motion:reduce){.quiz.in,.results.in{animation:none}}

.rtime b{display:block;font-size:24px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.rtime span{display:block;font-size:11.5px;color:var(--c07);margin-top:2px}
.tnum{font-variant-numeric:tabular-nums;color:var(--c07)}
.stu .tm{font-style:normal;font-size:12px;font-weight:700;color:var(--c03);font-variant-numeric:tabular-nums;min-width:52px}

</style>
